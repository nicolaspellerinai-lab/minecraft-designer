name: 🚀 Deploy Dashboard

on:
  push:
    branches: [ dashboard-deploy ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🔎 PHP lint
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq php-cli >/dev/null
        set -e
        for f in dashboard/database.php dashboard/api.php dashboard/config.php dashboard/api/index.php dashboard/api/config_endpoints.php; do
          php -l "$f"
        done

    - name: 🚀 Upload dashboard files via FTP
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        FTP_HOST: ${{ secrets.FTP_HOST }}
      run: |
        set -euo pipefail

        HOST="${FTP_HOST:-lepetitweb.com}"
        USER_ENC=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['FTP_USER'], safe=''))")
        PASS_ENC=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['FTP_PASS'], safe=''))")
        REMOTE_BASE="/oc/dashboard"

        upload() {
          local file="$1"
          local dest="$2"
          echo "=== Uploading ${file} -> ${dest} ==="
          local out
          if ! out=$(curl -sS --fail --ftp-pasv --connect-timeout 20 --max-time 120 \
              -T "${file}" "ftp://${USER_ENC}:${PASS_ENC}@${HOST}${dest}" 2>&1); then
            echo "::error::Upload failed for ${file}"
            echo "${out}" | tail -20
            exit 1
          fi
          echo "OK: ${file}"
        }

        upload dashboard/database.php                "${REMOTE_BASE}/database.php"
        upload dashboard/api.php                     "${REMOTE_BASE}/api.php"
        upload dashboard/config.php                  "${REMOTE_BASE}/config.php"
        upload dashboard/api/index.php               "${REMOTE_BASE}/api/index.php"
        upload dashboard/api/config_endpoints.php    "${REMOTE_BASE}/api/config_endpoints.php"

    - name: 🔍 Verify deployment
      run: |
        set -euo pipefail
        sleep 3
        echo "=== Checking dashboard API ==="
        body=$(curl -sS --max-time 30 "https://lepetitweb.com/oc/dashboard/api.php?path=kanban")
        echo "${body}" | head -20
        if echo "${body}" | grep -qi "Parse error\|Fatal error"; then
          echo "::error::Dashboard still returns a PHP error after deployment"
          exit 1
        fi
        echo "Dashboard OK"