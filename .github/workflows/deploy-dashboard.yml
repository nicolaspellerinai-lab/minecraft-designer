name: 🚀 Deploy Dashboard

on:
  push:
    branches: [ dashboard-deploy ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🚀 Upload database.php via FTP
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
      run: |
        echo "=== Uploading database.php ==="
        curl -v -T dashboard/database.php \
          "ftp://${FTP_USER}:${FTP_PASS}@lepetitweb.com:21/oc/dashboard/database.php" \
          --ftp-pasv -k 2>&1 | tail -20
        echo "EXIT_CODE: $?"
        
    - name: 🚀 Upload api.php via FTP
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
      run: |
        curl -T dashboard/api.php \
          "ftp://${FTP_USER}:${FTP_PASS}@lepetitweb.com:21/oc/dashboard/api.php" \
          --ftp-pasv -k 2>&1 | tail -5
        
    - name: 🚀 Upload config.php via FTP
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
      run: |
        curl -T dashboard/config.php \
          "ftp://${FTP_USER}:${FTP_PASS}@lepetitweb.com:21/oc/dashboard/config.php" \
          --ftp-pasv -k 2>&1 | tail -5
        
    - name: 🚀 Upload api/index.php via FTP
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
      run: |
        curl -T dashboard/api/index.php \
          "ftp://${FTP_USER}:${FTP_PASS}@lepetitweb.com:21/oc/dashboard/api/index.php" \
          --ftp-pasv -k 2>&1 | tail -5
        
    - name: 🚀 Upload api/config_endpoints.php via FTP
      env:
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
      run: |
        curl -T dashboard/api/config_endpoints.php \
          "ftp://${FTP_USER}:${FTP_PASS}@lepetitweb.com:21/oc/dashboard/api/config_endpoints.php" \
          --ftp-pasv -k 2>&1 | tail -5
        
    - name: 🔍 Verify deployment
      run: |
        sleep 3
        echo "=== Checking dashboard ==="
        curl -s "https://lepetitweb.com/oc/dashboard/api.php?path=kanban" 2>&1 | head -5